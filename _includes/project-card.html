<!-- _includes/project-card.html -->
<div class="project-card">
    <img src="{{ include.image }}" alt="{{ include.title }} Overview" class="project-image" />
    <div class="project-details">
      <h2>{{ include.title }}</h2>
      <p>{{ include.introText }}</p>
      <a href="{{ include.link }}" class="button read-more">Read More</a>
    </div>
  </div>
